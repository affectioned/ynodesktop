name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Prefer a PAT so the release tag/commit this action pushes DOES trigger
          # downstream workflows. GitHub suppresses workflow runs for events created
          # with GITHUB_TOKEN, which otherwise leaves the release with no built
          # binaries (release.yml never fires on the tag, requiring a manual tag
          # re-push). Falls back to GITHUB_TOKEN when RELEASE_PAT is not set, so
          # release-please keeps working; add a repo secret RELEASE_PAT (contents:
          # write + pull-requests:write) to enable automatic binary builds.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
